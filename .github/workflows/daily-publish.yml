name: Daily Post Publish

on:
  schedule:
    # 10분마다 실행 → 스크립트가 KST 10시 이후·당일 1회만 실제 발행
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # 수동 Run workflow 시 시간·당일 가드 무시
      FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run publish script
        run: node scripts/publish-draft.mjs

      - name: Commit and push (변경사항이 있을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경사항 없음 (가드 스킵·대기열 비음·이미 발행됨)"
          else
            TODAY=$(TZ=Asia/Seoul date +'%Y-%m-%d')
            git commit -m "publish: daily post ${TODAY}"
            git push
          fi

      - name: Notify queue status
        run: |
          COUNT=$(ls content/queue/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "현재 대기열 남은 글: ${COUNT}개"
