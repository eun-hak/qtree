# 매일 1편 발행 (대기열 → mock.ts / posts-content.ts)
#
# ⚠️ 이 저장소에서 GitHub schedule(cron)이 동작하지 않아,
#    cron-job.org 등 외부 스케줄러가 workflow_dispatch API를 호출하는 방식을 사용합니다.
#
# cron-job.org 설정 예:
#   URL: POST https://api.github.com/repos/eun-hak/qtree/actions/workflows/daily-publish.yml/dispatches
#   Headers: Authorization: Bearer <GITHUB_PAT>, Accept: application/vnd.github+json
#   Body: {"ref":"main"}
#   주기: 10분마다 (스크립트가 KST 10시 이후·당일 1회만 실제 발행)
#
# PAT 권한: repo (또는 Actions: Read and write)

name: Daily Post Publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 이미 발행했어도 1편 더 올리기 (테스트용)"
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FORCE_PUBLISH: ${{ inputs.force && '1' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run publish script
        run: node scripts/publish-draft.mjs

      - name: Commit and push (변경사항이 있을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경사항 없음 (가드 스킵·대기열 비음·이미 발행됨)"
          else
            TODAY=$(TZ=Asia/Seoul date +'%Y-%m-%d')
            git commit -m "publish: daily post ${TODAY}"
            git push
          fi

      - name: Notify queue status
        run: |
          COUNT=$(ls content/queue/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "현재 대기열 남은 글: ${COUNT}개"
