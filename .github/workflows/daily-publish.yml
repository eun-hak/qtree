# 대기열(content/queue) → mock.ts / posts-content.ts 발행 워크플로우
#
# ⚠️ [자동 발행 일시 중단]
#    AdSense "가치가 별로 없는 콘텐츠(양산형 콘텐츠)" 정책 대응을 위해
#    스케줄러에 의한 '하루 1편 자동 발행'을 중단했습니다.
#    외부 스케줄러(cron-job.org 등)가 dispatch를 호출해도 실제 발행되지 않습니다.
#
#    발행이 필요하면 Actions 탭에서 수동으로 'force = true'로 실행하세요.
#    (자동 양산 인상을 주지 않도록, 글은 직접 검토·보강 후 개별 발행 권장)

name: Daily Post Publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 이미 발행했어도 1편 더 올리기 (테스트용)"
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FORCE_PUBLISH: ${{ inputs.force && '1' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Auto-publish disabled notice
        if: ${{ inputs.force != true }}
        run: |
          echo "::notice::자동 발행이 중단된 상태입니다 (AdSense 콘텐츠 정책 대응). 발행하려면 force=true 로 수동 실행하세요."
          exit 0

      - name: Run publish script
        if: ${{ inputs.force == true }}
        run: node scripts/publish-draft.mjs

      - name: Commit and push (변경사항이 있을 때만)
        if: ${{ inputs.force == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경사항 없음 (가드 스킵·대기열 비음·이미 발행됨)"
          else
            TODAY=$(TZ=Asia/Seoul date +'%Y-%m-%d')
            git commit -m "publish: daily post ${TODAY}"
            git push
          fi

      - name: Notify queue status
        if: ${{ inputs.force == true }}
        run: |
          COUNT=$(ls content/queue/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "현재 대기열 남은 글: ${COUNT}개"
