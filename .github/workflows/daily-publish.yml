name: Daily Post Publish

on:
  schedule:
    # 매일 KST 10:00 (= UTC 01:00) 실행
    - cron: "0 1 * * *"
  # 수동 실행도 가능 (Actions 탭 → Run workflow)
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run publish script
        run: node scripts/publish-draft.mjs

      - name: Commit and push (변경사항이 있을 때만)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 오늘은 대기열이 비어 있습니다."
          else
            TODAY=$(date +'%Y-%m-%d')
            git commit -m "publish: daily post ${TODAY}"
            git push
          fi

      - name: Notify queue status
        run: |
          COUNT=$(ls content/queue/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "현재 대기열 남은 글: ${COUNT}개"
